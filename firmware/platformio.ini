[platformio]
default_envs = waveshare_s3_lcd13


[env:waveshare_s3_lcd13]
platform  = espressif32@6.13.0
board     = esp32-s3-devkitc-1

; Built by ESP-IDF, with the Arduino core compiled in as an IDF component.

framework = arduino, espidf

upload_speed  = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_upload.flash_size = 16MB
; Flash mode and PSRAM come from sdkconfig.defaults.

build_unflags = -DARDUINO_USB_MODE=1 -Werror=all

build_flags =
    -Wno-error

    ; ---- board: talk over the CH343 UART bridge, not native USB ----
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

    ; ---- TFT_eSPI setup (replaces User_Setup.h) ----
  
    -DUSE_HSPI_PORT=1
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_INVERSION_ON=1
    -DTFT_RGB_ORDER=1
    -DTFT_MOSI=41
    -DTFT_SCLK=40
    -DTFT_CS=39
    -DTFT_DC=38
    -DTFT_RST=42
    -DTFT_MISO=-1
    ; Fonts must be compiled in explicitly. TFT_eSPI does not warn when you
    ; draw with one that is missing
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

    ; ---- Edge Impulse model ----
    ; 8 MB octal PSRAM: the model heap-allocates its arena, so it lands there.
    -DBOARD_HAS_PSRAM

    ; ESP-IDF resolves includes through declared component directories, while
    ; PlatformIO's library finder walks every subdirectory. The SDK's vendored
    ; esp-dsp relies on the latter, so its include paths must be given.
    -Ilib/TinyML_Cat_inferencing/src/edge-impulse-sdk/porting/espressif/esp-dsp/modules/common/include
    -Ilib/TinyML_Cat_inferencing/src/edge-impulse-sdk/porting/espressif/esp-dsp/modules/fft/include
    -Ilib/TinyML_Cat_inferencing/src/edge-impulse-sdk/porting/espressif/ESP-NN/include

    ; esp-nn is ON

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
