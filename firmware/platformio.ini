[platformio]
default_envs = waveshare_s3_lcd13

; Waveshare ESP32-S3-LCD-1.3  (1.3" IPS 240x240, ST7789VW)
;
; Pins from the Waveshare schematic ESP32S3_1.3inch.SchDoc:
;   LCD  DC=38  CS=39  SCLK=40  MOSI=41  RST=42  backlight BL_PWM=20 (NPN, active HIGH)
;   USB-serial is a CH343P on UART0 (GPIO43/44), NOT the native USB peripheral,
;   so GPIO19/20 are free and USB-CDC-on-boot must stay off.

[env:waveshare_s3_lcd13]
platform  = espressif32@6.13.0
board     = esp32-s3-devkitc-1

; Built by ESP-IDF, with the Arduino core compiled in as an IDF component.
; Arduino is here for TFT_eSPI; everything else in src/ already calls IDF
; directly (driver/i2s.h, heap_caps_*), and the Edge Impulse SDK compiles in
; its Espressif porting mode either way.
;
; Arduino core 2.0.17 is built against ESP-IDF 4.4.7, so the espidf package has
; to match. The platform pins it to ~3.40407.0 automatically whenever arduino
; is in this list; with espidf alone it would jump to 5.5.3 and not build.
framework = arduino, espidf

upload_speed  = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_upload.flash_size = 16MB
; Flash mode and PSRAM come from sdkconfig.defaults.
; board_build.arduino.memory_type has no effect here: it selected one of
; Espressif's prebuilt sdkconfig variants, and nothing is prebuilt under espidf.

; ESP-IDF compiles with -Werror=all. The Edge Impulse SDK's vendored TFLite
; Micro does not build clean under it (tensorflow/lite/micro/kernels/select.cpp,
; maybe-uninitialized), and it is not our code to fix.
build_unflags = -DARDUINO_USB_MODE=1 -Werror=all

build_flags =
    -Wno-error

    ; ---- board: talk over the CH343 UART bridge, not native USB ----
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

    ; ---- TFT_eSPI setup (replaces User_Setup.h) ----
    ; USE_HSPI_PORT is required on the S3: TFT_eSPI's default FSPI resolves to
    ; arduino-esp32's FSPI==1, for which SPI_USER_REG(1) is not a real register
    ; base and the first writecommand() faults.  HSPI maps to SPI3, which is.
    -DUSE_HSPI_PORT=1
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_INVERSION_ON=1
    -DTFT_RGB_ORDER=1
    -DTFT_MOSI=41
    -DTFT_SCLK=40
    -DTFT_CS=39
    -DTFT_DC=38
    -DTFT_RST=42
    -DTFT_MISO=-1
    ; Fonts must be compiled in explicitly. TFT_eSPI does not warn when you
    ; draw with one that is missing: drawString simply produces nothing, which
    ; looks exactly like a dead display.
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

    ; ---- Edge Impulse model ----
    ; 8 MB octal PSRAM: the model heap-allocates its arena, so it lands there.
    -DBOARD_HAS_PSRAM

    ; ESP-IDF resolves includes through declared component directories, while
    ; PlatformIO's library finder walks every subdirectory. The SDK's vendored
    ; esp-dsp relies on the latter, so its include paths must be given.
    -Ilib/TinyML_Cat_inferencing/src/edge-impulse-sdk/porting/espressif/esp-dsp/modules/common/include
    -Ilib/TinyML_Cat_inferencing/src/edge-impulse-sdk/porting/espressif/esp-dsp/modules/fft/include
    -Ilib/TinyML_Cat_inferencing/src/edge-impulse-sdk/porting/espressif/ESP-NN/include

    ; esp-nn is ON
  

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
